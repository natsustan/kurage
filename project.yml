name: Kurage

options:
  bundleIdPrefix: com.spike
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  MarkdownView:
    url: https://github.com/natsustan/MarkdownView.git
    revision: b30f9bb05e0ae1738b836bdfe0ab26c849ef75ed

targets:
  Kurage:
    type: application
    platform: iOS
    sources:
      - path: KurageApp
    dependencies:
      - package: MarkdownView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spike.kurage
        PRODUCT_NAME: Kurage
        PRODUCT_MODULE_NAME: Kurage
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.4.2"
        CURRENT_PROJECT_VERSION: "9"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: Take photos to attach to your messages.
        INFOPLIST_KEY_CFBundleDisplayName: Kurage
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V6GTS74AND
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    scheme:
      testTargets:
        - KurageTests
        - KurageUITests

  KurageTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: Kurage
    sources:
      - path: KurageTests
    dependencies:
      - target: Kurage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spike.kurage.tests

  KurageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KurageUITests
    dependencies:
      - target: Kurage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spike.kurage.uitests
