name: Kurage

options:
  bundleIdPrefix: com.spike
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Kurage:
    type: application
    platform: iOS
    sources:
      - path: KurageApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spike.kurage
        PRODUCT_NAME: Kurage
        PRODUCT_MODULE_NAME: Kurage
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Kurage
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V6GTS74AND
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    scheme:
      testTargets:
        - KurageTests
        - KurageUITests

  KurageTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: Kurage
    sources:
      - path: KurageTests
    dependencies:
      - target: Kurage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spike.kurage.tests

  KurageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KurageUITests
    dependencies:
      - target: Kurage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spike.kurage.uitests
