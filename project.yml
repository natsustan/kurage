name: Kurage

options:
  bundleIdPrefix: com.spike
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  KurageCore:
    path: Packages/KurageCore

  MarkdownView:
    url: https://github.com/natsustan/MarkdownView.git
    revision: 39166ee72f79d61c00065544bf3b4938f084cef6

  OneSignal:
    url: https://github.com/OneSignal/OneSignal-iOS-SDK.git
    exactVersion: 5.5.1

targets:
  Kurage:
    type: application
    platform: iOS
    info:
      path: KurageApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KurageOneSignalAppID: $(KURAGE_ONESIGNAL_APP_ID)
        OneSignal_suppress_launch_urls: true
        UIBackgroundModes: [remote-notification]
    sources:
      - path: KurageApp
    dependencies:
      - package: KurageCore
      - package: MarkdownView
      - package: OneSignal
        product: OneSignalFramework
      - target: KurageNotificationService
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spike.kurage
        CODE_SIGN_ENTITLEMENTS: KurageApp/Kurage.entitlements
        APS_ENVIRONMENT: development
        KURAGE_ONESIGNAL_APP_ID: "199f71a9-c5a2-42c9-ac88-4b8b7593b06f"
        PRODUCT_NAME: Kurage
        PRODUCT_MODULE_NAME: Kurage
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.4.2"
        CURRENT_PROJECT_VERSION: "12"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: Take photos to attach to your messages.
        INFOPLIST_KEY_CFBundleDisplayName: Kurage
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V6GTS74AND
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          APS_ENVIRONMENT: production
        Debug:
          ENABLE_TESTABILITY: YES
    scheme:
      testTargets:
        - KurageTests
        - KurageUITests

  KurageNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: KurageNotificationService
        excludes: ["*.entitlements"]
    dependencies:
      - package: OneSignal
        product: OneSignalExtension
    info:
      path: KurageNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Kurage Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spike.kurage.notification-service
        CODE_SIGN_ENTITLEMENTS: KurageNotificationService/KurageNotificationService.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V6GTS74AND
        MARKETING_VERSION: "0.4.2"
        CURRENT_PROJECT_VERSION: "12"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  KurageTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: Kurage
    sources:
      - path: KurageTests
    dependencies:
      - target: Kurage
      - package: KurageCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spike.kurage.tests

  KurageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KurageUITests
    dependencies:
      - target: Kurage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spike.kurage.uitests

  KurageMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: KurageMac
    dependencies:
      - package: KurageCore
      - package: MarkdownView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spike.kurage.macos
        PRODUCT_NAME: KurageMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kurage
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V6GTS74AND
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: KurageMac/KurageMac.entitlements
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - KurageMacTests
        - KurageMacUITests

  KurageMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    hostApplication: KurageMac
    sources:
      - path: KurageMacTests
    dependencies:
      - target: KurageMac
      - package: KurageCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spike.kurage.macos.tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V6GTS74AND

  KurageMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: KurageMacUITests
    dependencies:
      - target: KurageMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spike.kurage.macos.uitests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V6GTS74AND
